  #     - name: 📦 Get Dependencies
  #       run: flutter pub get
  #
  #     - name: 🔧 Build iOS Release
  #       run: flutter build ios --release --no-codesign --verbose
  #
  #     - name: 📊 Generate Build Info
  #       run: |
  #         echo "# 🍎 iOS Build Information" > ios_build_info.md
  #         echo "" >> ios_build_info.md
  #         echo "**Version**: ${{ needs.prepare-release.outputs.version }}" >> ios_build_info.md
  #         echo "**Build Date**: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> ios_build_info.md
  #         echo "**Flutter Version**: ${{ env.FLUTTER_VERSION }}" >> ios_build_info.md
  #         echo "**Xcode Version**: $(xcodebuild -version | head -1)" >> ios_build_info.md
  #         echo "" >> ios_build_info.md
  #         echo "## 📦 Build Output:" >> ios_build_info.md
  #         echo "- iOS App Bundle Generated" >> ios_build_info.md
  #         echo "- Ready for App Store Connect upload" >> ios_build_info.md
  #
  #     - name: 📦 Upload iOS Build
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: ios-release-${{ needs.prepare-release.outputs.version }}
  #         path: |
  #           build/ios/iphoneos/
  #           ios_build_info.md

  # 🚀 GitHub Release作成
  create-release:
    name: 🚀 Create GitHub Release
    needs: [prepare-release, build-android-release] # iOSビルドを一時的に除外
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-aab-${{ needs.prepare-release.outputs.version }}
          path: ./android/

      - name: 📥 Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk-${{ needs.prepare-release.outputs.version }}
          path: ./android/

      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare-release.outputs.version }}
          name: 🎉 Nemuru v${{ needs.prepare-release.outputs.version }}
          body: ${{ needs.prepare-release.outputs.changelog }}
          files: |
            android/app-release.aab
            android/app-release.apk
            android/android_build_info.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Release Summary
        run: |
          echo "# 🎉 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: v${{ needs.prepare-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release Date**: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Assets Released:" >> $GITHUB_STEP_SUMMARY
          echo "- 🤖 Android APK (Direct Install)" >> $GITHUB_STEP_SUMMARY
          echo "- 🤖 Android AAB (Google Play Store)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔗 Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Download AAB file for Google Play Console upload" >> $GITHUB_STEP_SUMMARY
          echo "2. Test the release builds on Android devices" >> $GITHUB_STEP_SUMMARY
          echo "3. Upload to Google Play Store for production release" >> $GITHUB_STEP_SUMMARY