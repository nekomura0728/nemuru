name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

env:
  FLUTTER_VERSION: '3.32.0'
  JAVA_VERSION: '17'

jobs:
  # 🏷️ リリース準備
  prepare-release:
    name: 🏷️ Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📋 Generate Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手動実行の場合、pubspec.yamlから現在のバージョンを取得
            CURRENT_VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
            echo "Current version: $CURRENT_VERSION"
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            # タグプッシュの場合、タグからバージョンを取得
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "Tag version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: 📝 Generate Changelog
        id: changelog
        run: |
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "## 🎉 Release ${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### 🔧 Changes:" >> $GITHUB_OUTPUT
          git log --oneline --pretty=format:"- %s" -10 >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### 📊 Statistics:" >> $GITHUB_OUTPUT
          echo "- Commits in this release: $(git rev-list --count HEAD ^HEAD~10)" >> $GITHUB_OUTPUT
          echo "- Files changed: $(git diff --name-only HEAD~10 HEAD | wc -l)" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "🤖 Generated with [Claude Code](https://claude.ai/code)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # 🤖 Android リリースビルド
  build-android-release:
    name: 🤖 Build Android Release
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 📄 Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔐 Setup Android Signing
        run: |
          # Decode keystore from base64 secret
          echo "${{ secrets.KEYSTORE_JKS }}" | base64 -d > android/app/nemuru-upload-key.jks
          
          # Create key.properties file
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=nemuru-upload-key.jks
          EOF

      - name: 🔧 Build Release APK (Signed)
        run: flutter build apk --release --verbose

      - name: 🔧 Build Release App Bundle (Signed)
        run: flutter build appbundle --release --verbose

      - name: 📊 Generate Build Info
        run: |
          echo "# 🤖 Android Build Information" > android_build_info.md
          echo "" >> android_build_info.md
          echo "**Version**: ${{ needs.prepare-release.outputs.version }}" >> android_build_info.md
          echo "**Build Date**: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> android_build_info.md
          echo "**Flutter Version**: ${{ env.FLUTTER_VERSION }}" >> android_build_info.md
          echo "**Java Version**: ${{ env.JAVA_VERSION }}" >> android_build_info.md
          echo "" >> android_build_info.md
          echo "## 📦 Files Generated:" >> android_build_info.md
          echo "- app-release.apk ($(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1))" >> android_build_info.md
          echo "- app-release.aab ($(du -h build/app/outputs/bundle/release/app-release.aab | cut -f1))" >> android_build_info.md

      - name: 📦 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-${{ needs.prepare-release.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            android_build_info.md

      - name: 📦 Upload Release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab-${{ needs.prepare-release.outputs.version }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            android_build_info.md

  # 🍎 iOS リリースビルド (一時的に無効化 - Androidに集中)
